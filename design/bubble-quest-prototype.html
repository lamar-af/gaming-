<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Quest – Game booking prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#0B3954; --ink-soft:#4A6B7C; --foam:#EAF7F5; --surface:#FFFFFF; --line:#CFE7E3;
  --lagoon:#087E8B; --lagoon-ink:#FFFFFF; --coral:#E8484D; --sunny:#FFC857; --sunny-ink:#5A3E00;
  --kelp:#2E9E6A; --octo:#8E7DFF; --octo-deep:#5B47D6; --soft:#D9F1EC;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --abyss:#EAF7F5; --ink-soft:#A9C7D3; --foam:#062433; --surface:#0C3247; --line:#1B4A60;
    --lagoon:#3CC6CF; --lagoon-ink:#04232B; --coral:#FF7A7E; --kelp:#5ED39B; --soft:#103E55;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--foam);color:var(--abyss);font-family:"Nunito",system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem)} h2{font-size:1.6rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--sunny);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* navbar */
.nav{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:8px;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.2rem;margin-right:auto}
.links{display:flex;gap:4px}
.links button{background:none;border:0;color:var(--ink-soft);padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700}
.links button[aria-current="page"]{background:var(--soft);color:var(--abyss)}

/* buttons */
.btn{border:2px solid transparent;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--lagoon);color:var(--lagoon-ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--abyss);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--coral);border-color:var(--coral)}
.btn.big{padding:14px 26px;font-size:1.05rem;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* layout pieces */
main{padding:28px 0 90px}
.page-head{margin-bottom:22px}
.page-head p{color:var(--ink-soft);margin-top:6px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px}
.step{margin-bottom:22px}
.step-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step-num{width:30px;height:30px;border-radius:50%;background:var(--abyss);color:var(--foam);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:600;flex:none}
.muted{color:var(--ink-soft)}
.error{color:var(--coral);font-weight:700;font-size:.95rem;margin-top:8px}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;min-height:calc(100vh - 40px);padding:32px 0}
.hero{position:relative}
.hero p{font-size:1.15rem;color:var(--ink-soft);margin-top:12px;max-width:34ch}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--abyss)}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--foam);color:var(--abyss)}
.mascot-big{width:min(300px,70%);display:block;margin:24px 0 0}

/* game cards */
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.game{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;cursor:pointer;color:var(--abyss);position:relative}
.game .dot{width:38px;height:38px;border-radius:12px;margin-bottom:10px}
.game p{color:var(--ink-soft);font-size:.92rem;margin-top:6px}
.game .meta{font-size:.85rem;font-weight:700;margin-top:10px;color:var(--ink-soft)}
.game[aria-pressed="true"]{border-color:var(--lagoon);box-shadow:0 0 0 3px var(--lagoon) inset}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--abyss);cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal .dow{font-size:.8rem;font-weight:700;color:var(--ink-soft);padding:4px 0}
.day{aspect-ratio:1;border:0;border-radius:14px;background:var(--soft);color:var(--abyss);font-weight:700;cursor:pointer}
.day[disabled]{background:transparent;color:var(--ink-soft);opacity:.4;cursor:default}
.day[aria-pressed="true"]{background:var(--abyss);color:var(--foam)}
.day.today{outline:2px dashed var(--lagoon);outline-offset:-2px}

/* times */
.times{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.time{padding:10px 0;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--abyss);font-weight:700;cursor:pointer}
.time[aria-pressed="true"]{background:var(--sunny);border-color:var(--sunny);color:var(--sunny-ink)}
.time[disabled]{text-decoration:line-through;opacity:.4;cursor:not-allowed}

/* players */
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--abyss);font-size:1.4rem;cursor:pointer}
.stepper output{font-family:"Fredoka",sans-serif;font-size:2rem;font-weight:600;min-width:2ch;text-align:center}

.book-grid{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.summary{position:sticky;top:84px}
.summary dl{margin:12px 0 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.summary dt{color:var(--ink-soft)} .summary dd{margin:0;font-weight:700;text-align:right}

/* booking lists */
.list{display:grid;gap:12px}
.bk{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.bk .dot{width:46px;height:46px;border-radius:14px}
.bk .when{color:var(--ink-soft);font-size:.95rem}
.bk .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lock{font-size:.85rem;color:var(--ink-soft);max-width:22ch;text-align:right}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-left:6px;vertical-align:middle}
.badge.ok{background:var(--soft);color:var(--kelp)}
.badge.no{background:transparent;border:1.5px solid var(--coral);color:var(--coral)}
.section-label{font-family:"Fredoka",sans-serif;font-weight:500;font-size:1.05rem;color:var(--ink-soft);margin:24px 0 10px}

.empty{text-align:center;padding:36px 20px}
.empty svg{width:120px;margin:0 auto 12px;display:block}

.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.filters label{margin-top:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 16px}
.stat b{font-family:"Fredoka",sans-serif;font-size:1.4rem;display:block}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--abyss);color:var(--foam);padding:12px 20px;border-radius:999px;font-weight:700;z-index:20;display:none}
.toast.show{display:block}

.proto{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px;display:flex;gap:2px;z-index:10;font-size:.85rem}
.proto button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--ink-soft);font-weight:700}
.proto button[aria-pressed="true"]{background:var(--soft);color:var(--abyss)}

.bubble{position:absolute;border-radius:50%;border:2px solid var(--lagoon);opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .bubble{animation:rise 6s ease-in infinite}
  .bubble:nth-child(2){animation-delay:1.5s} .bubble:nth-child(3){animation-delay:3s} .bubble:nth-child(4){animation-delay:4.5s}
  @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.6}100%{transform:translateY(-220px);opacity:0}}
  .wave{animation:wave 2.4s ease-in-out infinite;transform-origin:50% 0}
  @keyframes wave{50%{transform:rotate(4deg)}}
}

@media (max-width:820px){
  .login{grid-template-columns:1fr;min-height:auto;gap:8px}
  .mascot-big{width:170px;margin:12px 0 0}
  .book-grid{grid-template-columns:1fr}
  .summary{position:static}
  .games{grid-template-columns:1fr}
  .times{grid-template-columns:repeat(4,minmax(0,1fr))}
  .filters{grid-template-columns:1fr}
  .bk{grid-template-columns:auto 1fr}
  .bk .actions{grid-column:1/-1;justify-content:flex-start}
  .lock{text-align:left;max-width:none}
  .links{order:3;width:100%}
}
</style>
</head>
<body>
<header class="nav" id="nav" hidden></header>
<div class="wrap"><main id="app"></main></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="proto" id="proto" hidden>
  <button data-action="role" data-role="customer">Customer</button>
  <button data-action="role" data-role="admin">Admin</button>
</div>

<script>
const GAMES = [
  { id:"the-maze",    name:"The Maze",    desc:"Find your way through twisting paths before time runs out.", color:"#2E9E6A" },
  { id:"escape-room", name:"Escape Room", desc:"Crack the codes and get out of the room in 60 minutes.",    color:"#E8484D" },
  { id:"mystery-lab", name:"Mystery Lab", desc:"Follow the clues and solve the mystery as a team.",         color:"#FFC857" },
];
const OPEN = 12, CLOSE = 22, MAX = 7, LOCK_HOURS = 6;
const game = id => GAMES.find(g => g.id === id);
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = (k,h=0) => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d,h); };
const fmtDay = d => d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtTime = d => `${pad(d.getHours())}:00`;
const now = () => new Date();
const dayAt = (plus,h) => { const d=new Date(); d.setDate(d.getDate()+plus); d.setHours(h,0,0,0); return d; };
const soon = (() => { const d=new Date(); d.setMinutes(0,0,0); d.setHours(d.getHours()+3); return d; })();

const ME = { name:"Lamar", email:"lamar@example.com" };
let bookings = [
  { id:1, game:"escape-room",  name:"Lamar",    email:"lamar@example.com", start:dayAt(1,16), players:5, status:"confirmed" },
  { id:2, game:"the-maze",  name:"Lamar",    email:"lamar@example.com", start:soon,        players:3, status:"confirmed" },
  { id:3, game:"mystery-lab", name:"Sara A.",  email:"sara@example.com",  start:dayAt(1,18), players:7, status:"confirmed" },
  { id:4, game:"the-maze",  name:"Omar K.",  email:"omar@example.com",  start:dayAt(2,13), players:4, status:"confirmed" },
  { id:5, game:"escape-room",  name:"Noura S.", email:"noura@example.com", start:dayAt(1,20), players:6, status:"cancelled" },
];
let nextId = 6;

const S = {
  screen:"login", role:"customer", hist:[], authTab:"signin", authError:"",
  sel:{ game:null, date:null, hour:null, players:2 }, month:new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  editingId:null, pickError:"", filter:{ date:"", game:"all", status:"all" },
};

const canModify = b => b.status === "confirmed" && (b.start - now()) > LOCK_HOURS*3600*1000;
const isTaken = (g,dateKey,h,ignoreId) => bookings.some(b =>
  b.status==="confirmed" && b.id!==ignoreId && b.game===g && keyOf(b.start)===dateKey && b.start.getHours()===h);
const home = () => S.role === "admin" ? "admin" : "book";

function mascot(size=60, waving=false){
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" aria-hidden="true">
    <g class="${waving?'wave':''}">
      <path d="M22 70 q-6 26 8 34 q4-14 12-22" fill="#8E7DFF"/>
      <path d="M40 78 q-4 28 12 32 q2-16 6-28" fill="#8E7DFF"/>
      <path d="M62 80 q4 28 18 28 q-4-16-6-30" fill="#8E7DFF"/>
      <path d="M80 72 q14 24 28 22 q-10-12-16-28" fill="#8E7DFF"/>
    </g>
    <ellipse cx="62" cy="52" rx="44" ry="40" fill="#8E7DFF"/>
    <ellipse cx="50" cy="32" rx="12" ry="7" fill="#B4A9FF"/>
    <circle cx="46" cy="54" r="11" fill="#fff"/><circle cx="78" cy="54" r="11" fill="#fff"/>
    <circle cx="48" cy="56" r="5.5" fill="#1B1446"/><circle cx="80" cy="56" r="5.5" fill="#1B1446"/>
    <circle cx="50" cy="53" r="1.8" fill="#fff"/><circle cx="82" cy="53" r="1.8" fill="#fff"/>
    <ellipse cx="36" cy="70" rx="6" ry="3.5" fill="#FF9DB0"/><ellipse cx="90" cy="70" rx="6" ry="3.5" fill="#FF9DB0"/>
    <path d="M54 72 q8 9 16 0" stroke="#1B1446" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- screens ---------- */
function loginScreen(){
  const up = S.authTab === "signup";
  return `<section class="login">
    <div class="hero">
      <div style="position:relative">
        <span class="bubble" style="width:18px;height:18px;left:12%;bottom:0"></span>
        <span class="bubble" style="width:10px;height:10px;left:30%;bottom:10px"></span>
        <span class="bubble" style="width:24px;height:24px;left:55%;bottom:0"></span>
        <span class="bubble" style="width:12px;height:12px;left:75%;bottom:20px"></span>
        ${mascot(300,true).replace('width="300" height="300"','class="mascot-big"')}
      </div>
      <h1 style="margin-top:16px">Dive in and book your next game</h1>
      <p>Three games, one hour each, up to seven friends. Bloop will save you a spot.</p>
    </div>
    <div class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="${!up}" data-action="tab" data-tab="signin">Sign in</button>
        <button role="tab" aria-selected="${up}" data-action="tab" data-tab="signup">Create account</button>
      </div>
      <form id="authForm" novalidate>
        ${up ? `<label for="name">Your name</label><input id="name" autocomplete="name" placeholder="Lamar">` : ""}
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="At least 6 characters">
        ${S.authError ? `<p class="error" role="alert">${S.authError}</p>` : ""}
        <button class="btn big" style="margin-top:18px" type="submit">${up ? "Create account" : "Sign in"}</button>
      </form>
    </div>
  </section>`;
}

function pickerScreen(editing){
  const sel = S.sel, b = editing ? bookings.find(x=>x.id===S.editingId) : null;
  const y = S.month.getFullYear(), m = S.month.getMonth();
  const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  const todayKey = keyOf(now()), today0 = fromKey(todayKey);
  let cal = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="dow">${d}</div>`).join("");
  cal += "<div></div>".repeat(first);
  for(let d=1; d<=days; d++){
    const k = keyOf(new Date(y,m,d)), past = new Date(y,m,d) < today0;
    cal += `<button class="day ${k===todayKey?'today':''}" ${past?'disabled':''} aria-pressed="${sel.date===k}" data-action="date" data-date="${k}" aria-label="${fmtDay(new Date(y,m,d))}">${d}</button>`;
  }
  const canPrev = new Date(y,m,1) > new Date(today0.getFullYear(), today0.getMonth(), 1);

  let times = "";
  if(sel.game && sel.date){
    for(let h=OPEN; h<CLOSE; h++){
      const start = fromKey(sel.date,h);
      const off = start <= now() || isTaken(sel.game, sel.date, h, S.editingId);
      times += `<button class="time" ${off?'disabled':''} aria-pressed="${sel.hour===h}" data-action="hour" data-h="${h}">${pad(h)}:00</button>`;
    }
  }
  const g = sel.game && game(sel.game);
  const when = sel.date && sel.hour!=null ? `${fmtDay(fromKey(sel.date))}, ${pad(sel.hour)}:00` : "Not picked yet";

  return `<div class="page-head">
      <h2>${editing ? "Change your booking" : "Book a game"}</h2>
      <p>${editing ? "You can change the game, day, time, or players until 6 hours before your session." : "Each session is 60 minutes for up to 7 players."}</p>
    </div>
    <div class="book-grid">
      <div>
        <section class="step">
          <div class="step-title"><span class="step-num">1</span><h3>Pick a game</h3></div>
          <div class="games">${GAMES.map(x=>`
            <button class="game" aria-pressed="${sel.game===x.id}" data-action="game" data-id="${x.id}">
              <div class="dot" style="background:${x.color}"></div>
              <h3>${x.name}</h3><p>${x.desc}</p>
              <div class="meta">60 min · up to 7 players</div>
            </button>`).join("")}</div>
        </section>
        <section class="step panel">
          <div class="step-title"><span class="step-num">2</span><h3>Pick a day</h3></div>
          <div class="cal-head">
            <button data-action="month" data-d="-1" aria-label="Previous month" ${canPrev?'':'disabled'}>‹</button>
            <strong>${S.month.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</strong>
            <button data-action="month" data-d="1" aria-label="Next month">›</button>
          </div>
          <div class="cal">${cal}</div>
        </section>
        <section class="step panel">
          <div class="step-title"><span class="step-num">3</span><h3>Pick a time</h3></div>
          ${times ? `<div class="times">${times}</div><p class="muted" style="margin-top:10px;font-size:.9rem">Crossed-out times are already booked or have passed.</p>`
                  : `<p class="muted">Choose a game and a day to see open times.</p>`}
        </section>
        <section class="step panel">
          <div class="step-title"><span class="step-num">4</span><h3>How many players?</h3></div>
          <div class="stepper">
            <button data-action="players" data-d="-1" aria-label="Fewer players">−</button>
            <output aria-live="polite">${sel.players}</output>
            <button data-action="players" data-d="1" aria-label="More players">+</button>
            <span class="muted">1 to 7 players</span>
          </div>
        </section>
      </div>
      <aside class="panel summary">
        <div style="display:flex;align-items:center;gap:10px">${mascot(48)}<h3>Your booking</h3></div>
        <dl>
          <dt>Game</dt><dd>${g ? g.name : "Not picked yet"}</dd>
          <dt>When</dt><dd>${when}</dd>
          <dt>Players</dt><dd>${sel.players}</dd>
          <dt>Name</dt><dd>${ME.name}</dd>
          <dt>Email</dt><dd style="word-break:break-all">${ME.email}</dd>
        </dl>
        ${S.pickError ? `<p class="error" role="alert" style="margin-bottom:10px">${S.pickError}</p>` : ""}
        <button class="btn big" data-action="${editing?'save':'confirm'}">${editing ? "Save changes" : "Confirm booking"}</button>
        ${editing ? `<button class="btn ghost big" style="margin-top:8px" data-action="back">Keep it as it is</button>` : ""}
      </aside>
    </div>`;
}

function bookingRow(b, admin){
  const g = game(b.game), mod = canModify(b), cancelled = b.status==="cancelled";
  const badge = cancelled ? `<span class="badge no">Cancelled</span>` : `<span class="badge ok">Confirmed</span>`;
  let actions = "";
  if(admin){
    actions = cancelled ? "" : `<button class="btn danger" data-action="admincancel" data-id="${b.id}">Cancel booking</button>`;
  } else if(!cancelled && b.start > now()){
    actions = mod
      ? `<button class="btn ghost" data-action="edit" data-id="${b.id}">Change</button>
         <button class="btn danger" data-action="cancel" data-id="${b.id}">Cancel</button>`
      : `<p class="lock">Changes close 6 hours before your session. Contact the venue for help.</p>`;
  }
  return `<article class="bk">
    <div class="dot" style="background:${g.color}"></div>
    <div>
      <h3>${g.name} ${badge}</h3>
      <p class="when">${fmtDay(b.start)} · ${fmtTime(b.start)}–${pad(b.start.getHours()+1)}:00 · ${b.players} player${b.players>1?'s':''}</p>
      ${admin ? `<p class="when">${b.name} · ${b.email}</p>` : ""}
    </div>
    <div class="actions">${actions}</div>
  </article>`;
}

function emptyState(title, text, cta){
  return `<div class="panel empty">${mascot(120)}<h3>${title}</h3><p class="muted" style="margin:6px 0 16px">${text}</p>${cta||""}</div>`;
}

function mineScreen(){
  const mine = bookings.filter(b=>b.email===ME.email).sort((a,b)=>a.start-b.start);
  const up = mine.filter(b=>b.start>now() && b.status==="confirmed");
  const rest = mine.filter(b=>!up.includes(b));
  if(!mine.length) return `<div class="page-head"><h2>My bookings</h2></div>` +
    emptyState("No games booked yet","Pick a game and grab a time for you and your friends.",`<button class="btn" data-action="nav" data-to="book">Book a game</button>`);
  return `<div class="page-head"><h2>My bookings</h2><p>You can change or cancel a booking until 6 hours before it starts.</p></div>
    <p class="section-label">Coming up</p>
    <div class="list">${up.length ? up.map(b=>bookingRow(b,false)).join("") : `<p class="muted">Nothing coming up.</p>`}</div>
    ${rest.length ? `<p class="section-label">Past and cancelled</p><div class="list">${rest.map(b=>bookingRow(b,false)).join("")}</div>` : ""}`;
}

function adminScreen(){
  const f = S.filter;
  const list = bookings.filter(b =>
    (!f.date || keyOf(b.start)===f.date) && (f.game==="all" || b.game===f.game) && (f.status==="all" || b.status===f.status)
  ).sort((a,b)=>a.start-b.start);
  const confirmed = bookings.filter(b=>b.status==="confirmed" && b.start>now());
  const players = confirmed.reduce((s,b)=>s+b.players,0);
  return `<div class="page-head"><h2>All bookings</h2><p>See who’s coming and cancel a booking when you need to.</p></div>
    <div class="stats">
      <div class="stat"><b>${confirmed.length}</b><span class="muted">upcoming sessions</span></div>
      <div class="stat"><b>${players}</b><span class="muted">players expected</span></div>
    </div>
    <div class="filters panel">
      <div><label for="fDate">Day</label><input id="fDate" type="date" value="${f.date}" data-filter="date"></div>
      <div><label for="fGame">Game</label><select id="fGame" data-filter="game">
        <option value="all">All games</option>${GAMES.map(g=>`<option value="${g.id}" ${f.game===g.id?'selected':''}>${g.name}</option>`).join("")}
      </select></div>
      <div><label for="fStatus">Status</label><select id="fStatus" data-filter="status">
        <option value="all">All</option>
        <option value="confirmed" ${f.status==="confirmed"?'selected':''}>Confirmed</option>
        <option value="cancelled" ${f.status==="cancelled"?'selected':''}>Cancelled</option>
      </select></div>
    </div>
    <div class="list">${list.length ? list.map(b=>bookingRow(b,true)).join("")
      : emptyState("No bookings match","Try another day or clear the filters.",`<button class="btn ghost" data-action="clearfilters">Clear filters</button>`)}</div>`;
}

function navBar(){
  const links = S.role==="admin"
    ? [["admin","All bookings"]]
    : [["book","Book a game"],["mine","My bookings"]];
  const cur = S.screen==="edit" ? "mine" : S.screen;
  return `<div class="wrap">
    <button class="btn ghost" data-action="back" aria-label="Go back">‹ Back</button>
    <div class="brand">${mascot(34)}Bubble Quest</div>
    <nav class="links">${links.map(([to,l])=>`<button data-action="nav" data-to="${to}" ${cur===to?'aria-current="page"':''}>${l}</button>`).join("")}</nav>
    <button class="btn ghost" data-action="logout">Log out</button>
  </div>`;
}

/* ---------- render + actions ---------- */
function render(){
  const nav = document.getElementById("nav"), proto = document.getElementById("proto");
  nav.hidden = S.screen==="login"; proto.hidden = S.screen==="login";
  if(!nav.hidden) nav.innerHTML = navBar();
  proto.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.role===S.role));
  const app = document.getElementById("app");
  app.innerHTML = {login:loginScreen, book:()=>pickerScreen(false), edit:()=>pickerScreen(true), mine:mineScreen, admin:adminScreen}[S.screen]();
}
function go(screen){ if(S.screen!==screen) S.hist.push(S.screen); S.screen=screen; S.pickError=""; render(); window.scrollTo(0,0); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2600); }
function resetSel(){ S.sel={game:null,date:null,hour:null,players:2}; S.editingId=null; }

const actions = {
  tab: el => { S.authTab = el.dataset.tab; S.authError=""; render(); },
  nav: el => { if(el.dataset.to==="book") resetSel(); go(el.dataset.to); },
  back: () => { const p = S.hist.pop(); S.screen = (p && p!=="login") ? p : home(); if(S.screen!=="edit") S.editingId=null; render(); window.scrollTo(0,0); },
  logout: () => { S.hist=[]; resetSel(); S.screen="login"; S.authTab="signin"; render(); toast("You’re logged out"); },
  role: el => { S.role = el.dataset.role; S.hist=[]; resetSel(); S.screen = home(); render(); },
  game: el => { S.sel.game = el.dataset.id; S.sel.hour=null; S.pickError=""; render(); },
  date: el => { S.sel.date = el.dataset.date; S.sel.hour=null; S.pickError=""; render(); },
  hour: el => { S.sel.hour = Number(el.dataset.h); S.pickError=""; render(); },
  month: el => { S.month = new Date(S.month.getFullYear(), S.month.getMonth()+Number(el.dataset.d), 1); render(); },
  players: el => { S.sel.players = Math.min(MAX, Math.max(1, S.sel.players + Number(el.dataset.d))); render(); },
  confirm: () => {
    const s=S.sel;
    if(!s.game || !s.date || s.hour==null){ S.pickError="Pick a game, a day, and a time first."; return render(); }
    if(isTaken(s.game,s.date,s.hour)){ S.pickError="That time was just taken. Pick another one."; s.hour=null; return render(); }
    bookings.push({ id:nextId++, game:s.game, name:ME.name, email:ME.email, start:fromKey(s.date,s.hour), players:s.players, status:"confirmed" });
    resetSel(); go("mine"); toast("Booking confirmed");
  },
  edit: el => {
    const b = bookings.find(x=>x.id===Number(el.dataset.id));
    S.editingId=b.id; S.sel={ game:b.game, date:keyOf(b.start), hour:b.start.getHours(), players:b.players };
    S.month=new Date(b.start.getFullYear(), b.start.getMonth(), 1); go("edit");
  },
  save: () => {
    const b = bookings.find(x=>x.id===S.editingId), s=S.sel;
    if(!canModify(b)){ S.pickError="This booking is within 6 hours of its start, so it can’t be changed."; return render(); }
    if(!s.game || !s.date || s.hour==null){ S.pickError="Pick a game, a day, and a time first."; return render(); }
    if(isTaken(s.game,s.date,s.hour,b.id)){ S.pickError="That time was just taken. Pick another one."; s.hour=null; return render(); }
    Object.assign(b,{ game:s.game, start:fromKey(s.date,s.hour), players:s.players });
    resetSel(); S.hist=S.hist.filter(x=>x!=="edit"); S.screen="mine"; render(); toast("Changes saved");
  },
  cancel: el => {
    const b = bookings.find(x=>x.id===Number(el.dataset.id));
    if(!canModify(b)) return toast("Changes close 6 hours before your session");
    if(confirm(`Cancel your ${game(b.game).name} booking on ${fmtDay(b.start)} at ${fmtTime(b.start)}?`)){ b.status="cancelled"; render(); toast("Booking cancelled"); }
  },
  admincancel: el => {
    const b = bookings.find(x=>x.id===Number(el.dataset.id));
    if(confirm(`Cancel ${b.name}’s ${game(b.game).name} booking? The time will open up again.`)){ b.status="cancelled"; b.cancelledBy="admin"; render(); toast("Booking cancelled"); }
  },
  clearfilters: () => { S.filter={date:"",game:"all",status:"all"}; render(); },
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if(el && actions[el.dataset.action]) actions[el.dataset.action](el);
});
document.addEventListener("change", e => {
  const f = e.target.dataset.filter;
  if(f){ S.filter[f] = e.target.value; render(); }
});
document.addEventListener("submit", e => {
  if(e.target.id!=="authForm") return;
  e.preventDefault();
  const name = document.getElementById("name"), email = document.getElementById("email").value.trim(), pw = document.getElementById("pw").value;
  if(name && !name.value.trim()) S.authError = "Enter your name.";
  else if(!/^\S+@\S+\.\S+$/.test(email)) S.authError = "Enter a valid email address.";
  else if(pw.length < 6) S.authError = "Use at least 6 characters for your password.";
  else S.authError = "";
  if(S.authError) return render();
  if(name) ME.name = name.value.trim();
  ME.email = email;
  bookings.filter(b=>b.name==="Lamar").forEach(b=>{ b.email=email; b.name=ME.name; });
  S.hist=[]; resetSel(); S.screen=home(); render();
  toast(S.authTab==="signup" ? `Welcome aboard, ${ME.name}` : `Welcome back, ${ME.name}`);
});

render();
</script>
</body>
</html>
